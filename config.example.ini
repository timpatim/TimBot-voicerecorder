# Configuration du bot Discord d'enregistrement vocal.
# Modifie les valeurs puis relance le programme (les étapes de [fin_de_session] sont relues à chaque /stop).
# Booléens : oui / non. Les lignes commençant par # sont des commentaires.
# Une variable d'environnement historique (ex. WHISPER_MODEL) prime sur ce fichier si elle est définie.

# ---- Discord ----
[discord]
# Jeton du bot. Mieux vaut le laisser vide et définir la variable d'environnement DISCORD_TOKEN.
# (variable d'environnement équivalente : DISCORD_TOKEN)
token = 

# Identifiant de ton serveur : les commandes apparaissent instantanément (vide = commandes globales, plus lentes).
# (variable d'environnement équivalente : DISCORD_GUILD_ID)
guild_id = 

# Identifiant du salon texte des messages SYSTÈME et informatifs : suivi du traitement de fin de session, alertes,
# une ligne de trace à chaque commande lancée par un joueur, compte rendu et fichiers de /campagne resumer, integrer et
# pack sortie:fichier. Les réponses aux demandes (/regle, /transcript, /stats, /campagne afficher...) restent dans le salon
# où la commande est tapée. Vide = tout dans le salon de la commande (pas de trace). Pour l'obtenir : Paramètres
# Discord > Avancés > Mode développeur, puis clic droit sur le salon > Copier l'identifiant du salon.
# Le bot doit pouvoir y voir le salon, écrire et intégrer des liens.
canal_messages = 

# Message affiché au /record. {canal} est remplacé par le canal vocal.
message_consentement = 🔴 **Enregistrement en cours** dans {canal}. L'audio de chaque participant et sa transcription sont conservés. Quitte le canal si tu ne souhaites pas être enregistré. `/stop` pour terminer.

# ---- Modèles téléchargés (Whisper, OmniVoice, Chatterbox...) ----
[modeles]
# Dossier où sont téléchargés les modèles (Whisper, alignement, voix), relatif au dossier du programme. Vide = cache
# habituel de Hugging Face et PyTorch (~/.cache). Les modèles déjà téléchargés ailleurs ne sont pas déplacés : ils
# sont retéléchargés (plusieurs Go) ; pour les réutiliser, copiez ~/.cache/huggingface/hub dans <dossier>/huggingface/.
dossier = modeles

# ---- Enregistrements ----
[sessions]
# Dossier où sont créées les sessions.
dossier = sessions

# ---- Archivage audio ----
[audio]
# Gigue réseau tolérée (ms) avant de considérer qu'un utilisateur s'est tu et de combler avec du silence.
tolerance_trou_ms = 200

# Intervalle (s) entre deux écritures sur disque des fichiers WAV.
flush_s = 1.0

# Intervalle (s) de mise à jour de meta.json pendant l'enregistrement.
meta_toutes_les_s = 10

# ---- Détection de voix (VAD) et découpage en énoncés ----
[vad]
# webrtcvad, de 0 (permissif) à 3 (strict). Plus strict = moins de bruit détecté comme voix.
# (variable d'environnement équivalente : VAD_AGGRESSIVENESS)
agressivite = 2

# Seuil RMS du VAD de repli (utilisé seulement si webrtcvad n'est pas installé).
# (variable d'environnement équivalente : VAD_RMS)
seuil_energie_rms = 400.0

# Audio conservé (ms) avant le début détecté de la parole.
pre_roll_ms = 300

# Début de parole : nombre de trames de 20 ms examinées...
debut_fenetre = 5

# ... dont au moins ce nombre doivent être voisées.
debut_trames_voisees = 3

# Fin d'énoncé après ce silence (ms).
silence_fin_ms = 700

# Audio conservé (ms) après la dernière trame voisée.
marge_fin_ms = 200

# Durée maximale (s) d'un énoncé avant découpage forcé.
enonce_max_s = 20

# Un énoncé a au moins ce nombre de trames voisées (22 = 440 ms), sinon c'est du bruit.
min_trames_voisees = 22

# Un énoncé plus faible que ce niveau RMS (dBFS) n'est pas envoyé à WhisperX.
# (variable d'environnement équivalente : MIN_UTTERANCE_DBFS)
niveau_min_dbfs = -45.0

# ---- Transcription WhisperX ----
[whisper]
# Modèle WhisperX : tiny, base, small, medium, large-v3...
# (variable d'environnement équivalente : WHISPER_MODEL)
modele = small

# cuda ou cpu (vide = détection automatique).
# (variable d'environnement équivalente : WHISPER_DEVICE)
device = 

# float16, int8... (vide = float16 sur GPU, int8 sur CPU).
# (variable d'environnement équivalente : WHISPER_COMPUTE)
calcul = 

# Langue parlée.
# (variable d'environnement équivalente : WHISPER_LANG)
langue = fr

# Taille de batch (0 = automatique : 8 sur GPU, 1 sur CPU).
# (variable d'environnement équivalente : WHISPER_BATCH)
batch = 0

# Alignement mot à mot : timestamps plus précis, un peu plus lent.
# (variable d'environnement équivalente : WHISPERX_ALIGN)
alignement = oui

# Expression régulière : les segments qui la contiennent sont rejetés (sous-titres inventés sur du silence).
filtre_hallucinations = sous-?titr|amara\.org|merci d['’]avoir regard|abonne[zr]-vous

# Mots (séparés par des virgules ou des espaces) : une phrase qui ne contient QUE ces mots, éventuellement répétés
# (« Merci. », « merci, merci ! »), est rejetée comme bruit : Whisper invente ces mots sur les bruits de fond. « Merci beaucoup » est conservé. Vide = rien d'ignoré.
mots_seuls_ignores = merci, au revoir, bye, amen

# ---- Suivi en direct (console, statut du bot, file d'attente) ----
[live]
# Trace chaque énoncé (durée, niveau, décision) pour régler les seuils.
# (variable d'environnement équivalente : LIVE_DEBUG)
debug = non

# Secondes entre deux lignes de suivi en console pendant un REC (0 = seulement les changements d'état).
# (variable d'environnement équivalente : LIVE_STATUS_INTERVAL)
statut_console_s = 10.0

# Secondes d'audio en attente qui remplissent la barre et déclenchent l'alerte.
# (variable d'environnement équivalente : ASR_BACKLOG_WARN)
retard_alerte_s = 30.0

# Nombre de messages gardés en mémoire pour /transcript.
historique = 500

# Délai minimal (s) entre deux changements de texte du statut Discord (limite de Discord).
statut_discord_texte_s = 15.0

# Fréquence (s) de vérification de l'état pour le statut et la console.
statut_scrutation_s = 1.0

# À /stop : attente maximale (s) que WhisperX vide sa file.
attente_fin_asr_s = 300

# ---- Statistiques ----
[stats]
# Interruptions : on cherche l'intervenant coupé dans cette fenêtre (s).
fenetre_interruption_s = 30.0

# Chevauchement minimal (s) pour compter une interruption.
chevauchement_interruption_s = 0.3

# Pause maximale (s) entre deux segments d'un même monologue.
pause_monologue_s = 3.0

# Durée minimale (s) pour afficher le plus long monologue.
monologue_min_s = 8.0

# Temps de parole minimal (s) pour calculer les mots/min.
parole_min_mots_min_s = 10.0

# Durée minimale (s) pour afficher le plus long silence.
silence_affiche_min_s = 10.0

# Occurrences minimales pour qu'un mot soit « favori ».
mot_favori_min = 3

# Nombre de mots dans « mots les plus utilisés ».
nb_mots_top = 5

# Intervenants affichés dans le tableau Discord.
lignes_tableau_discord = 15

# Mots à ignorer en plus de la liste intégrée pour les stats de vocabulaire (séparés par des espaces ou virgules).
mots_vides_supplementaires = 

# ---- Rapport PDF ----
[rapport]
# Intervenants affichés dans les graphiques du PDF.
max_intervenants_graphiques = 12

# ---- Traitement de fin de session (modifiable avec /config pour les étapes) ----
[fin_de_session]
# Convertir les fichiers WAV en MP3
mp3 = oui

# Débit MP3 en kbit/s (voix mono : 48 à 96 suffit)
mp3_kbps = 64

# Générer le rapport PDF (avec les statistiques)
rapport = oui

# Déposer les fichiers sur Google Drive
drive = oui

# Drive : inclure l'audio (MP3, ou WAV si la conversion est désactivée)
drive_audio = oui

# Drive : inclure le transcript
drive_transcript = oui

# Transcript nettoyé : mots retirés quand ils forment une réplique à eux seuls (sons sans sens). « oui », « non », « ok » sont conservés : ce sont des réponses.
nettoyage_mots_ignores = euh, heu, hum, hmm, mhm

# Transcript nettoyé : fusionne les répliques consécutives d'un même locuteur séparées de moins de N secondes (0 = jamais : chaque réplique garde son horodatage et son locuteur).
nettoyage_fusion_s = 0.0

# Drive : déposer aussi le transcript brut (par défaut, seul le transcript nettoyé est déposé ; le brut reste en local).
drive_transcript_brut = non

# Drive : inclure le rapport PDF
drive_rapport = oui

# Drive : « lien » = toute personne ayant le lien peut consulter, « aucun » = privé
partage = lien

# Commande lancée en fin de session, ex. python reprocess.py (reçoit le dossier de session en argument).
# (variable d'environnement équivalente : REPROCESS_CMD)
commande_retraitement = 

# ---- Conversion MP3 ----
[mp3]
# Chemin de ffmpeg s'il n'est pas dans le PATH.
# (variable d'environnement équivalente : FFMPEG)
ffmpeg = ffmpeg

# ---- Google Drive ----
[drive]
# Client OAuth « application de bureau ».
# (variable d'environnement équivalente : GOOGLE_CREDENTIALS)
identifiants = credentials.json

# Jeton Google mis en cache après la première autorisation.
# (variable d'environnement équivalente : GOOGLE_TOKEN)
jeton = token.json

# Dossier racine sur le Drive.
# (variable d'environnement équivalente : DRIVE_ROOT_NAME)
dossier_racine = Enregistrements Discord

# Attente maximale (s) de la connexion Google avant échec de l'étape.
attente_connexion_s = 180

# Taille des blocs d'envoi (Mo).
taille_bloc_mo = 8

# ---- Google Gemini : questions de règles (/regle) et génération du contexte de campagne (/campagne) ----
[regles]
# Active la commande /regle.
activer = oui

# Clé d'API Google Gemini (https://aistudio.google.com/apikey). Mieux vaut la laisser vide
# et définir la variable d'environnement GEMINI_API_KEY.
# (variable d'environnement équivalente : GEMINI_API_KEY)
cle_api = 

# Modèle Gemini. « gemini-flash-latest » suit automatiquement la dernière version Flash.
modele = gemini-3.6-flash

# Jeu de repli : utilisé par /regle quand elle est lancée sans préciser le jeu et qu'aucune campagne n'est active
# (sinon /regle prend le jeu de la campagne en cours), et pour une nouvelle campagne créée sans jeu.
jeu_par_defaut = Pathfinder première édition

# Nombre de dernières phrases du transcript envoyées à Gemini (1 à 50).
nb_phrases = 15

# Longueur maximale (caractères) de la question libre de /regle.
question_max = 1500

# Créativité de la réponse (0 = très factuel, 2 = très libre).
temperature = 0.2

# Niveau de « réflexion » de Gemini 3.x : low (rapide, recommandé), medium, high (plus lent, souvent plusieurs
# dizaines de secondes), minimal (pas toujours accepté), auto (ne rien envoyer : valeur par défaut du modèle,
# à utiliser avec un modèle qui ne gère pas ce réglage, comme gemini-2.5-flash).
reflexion = low

# Autorise Gemini à s'appuyer sur la recherche Google pour vérifier la règle (plus fiable, plus lent).
recherche_web = non

# Temps maximal d'attente de la réponse de Gemini (s).
delai_attente_s = 60

# Délai minimal (s) entre deux /regle sur un même serveur (évite les abus).
delai_min_s = 10

# Consigne envoyée à Gemini. {jeu} est remplacé par le nom du jeu. Doit tenir sur une seule ligne.
instruction = Tu es arbitre et expert des règles du jeu « {jeu} ». Tu reçois les dernières phrases échangées à l'oral par des joueurs autour de la table (transcription automatique : erreurs, noms propres déformés, phrases coupées possibles). Repère le point de règle dont ils parlent ou sur lequel ils hésitent, puis : 1) formule-le en une phrase ; 2) explique la règle précisément, avec conditions, exceptions et cas limites utiles ; 3) tranche le cas concret évoqué s'il y en a un ; 4) cite la source (livre, chapitre) seulement si tu en es sûr. Si tu n'es pas certain, ou si plusieurs interprétations existent (errata, différences entre éditions, règle optionnelle), dis-le clairement plutôt que d'inventer. Réponds en français, de façon concise (moins de 1500 caractères), sans introduction ni formule de politesse. Si aucune question de règle ne ressort, dis-le en une phrase.

# Consigne envoyée à Gemini quand /regle reçoit une question libre. {jeu} est remplacé par le nom du jeu. Une seule ligne.
instruction_question = Tu es arbitre et expert des règles du jeu « {jeu} ». Un joueur te pose une question de règle précise. Réponds-y directement : 1) la règle, avec conditions, exceptions et cas limites utiles ; 2) tranche le cas concret décrit s'il y en a un ; 3) cite la source (livre, chapitre) seulement si tu en es sûr. Si tu n'es pas certain, ou si plusieurs interprétations existent (errata, différences entre éditions, règle optionnelle), dis-le clairement plutôt que d'inventer. Si la question manque de précision pour trancher, dis ce qu'il faudrait savoir. Réponds en français, de façon concise (moins de 1500 caractères), sans introduction ni formule de politesse.

# ---- Campagnes de jeu de rôle (commande /campagne) ----
[campagnes]
# Dossier où sont rangées les campagnes (un sous-dossier par campagne : contexte, joueurs, résumés).
dossier = campagnes

# Taille maximale (Ko) du texte de contexte qu'on peut envoyer à /campagne contexte.
taille_max_brut_ko = 200

# Taille maximale (Ko) d'un transcript joint à /campagne resumer.
taille_max_transcript_ko = 5000

# À la fin d'une session, génère automatiquement le compte rendu, le résumé global et le « précédemment » (Gemini).
resume_auto = non

# /campagne pack copie le pack dans le presse-papiers et /campagne integrer lit la réponse dans le presse-papiers (sans fichier). Il s'agit du presse-papiers de la machine qui fait tourner le bot : à mettre sur non si le bot tourne sur un autre ordinateur que ton client Discord (utilise alors les fichiers).
presse_papiers = oui

# Moteur de /campagne resumer : claude (programme `claude` de ton abonnement, voir [claude]) ou gemini (ancienne méthode, plusieurs appels, clé Gemini requise).
moteur_resume = claude

# Pack allégé : fusionne les répliques consécutives d'un même locuteur séparées de moins de N secondes (moins de texte à envoyer, donc moins d'usage de l'abonnement ; 0 = aucune fusion). Seule la première réplique d'un bloc garde son horodatage.
pack_fusion_s = 10.0

# Découpe des packs : durée (minutes) d'une partie, 0 = un seul pack par séance. À activer (ex. 60) si le chat utilisé ne lit pas les longs fichiers jusqu'au bout.
pack_minutes = 0

# Durée (minutes) des tranches de transcript analysées une à une.
tranche_minutes = 30

# Temps maximal d'attente (s) d'une réponse de Gemini pour la mémoire de campagne.
delai_attente_s = 300

# ---- Claude (ton abonnement, via le programme `claude`) : résumés de campagne avec /campagne resumer ----
[claude]
# Programme Claude Code à lancer : « claude » s'il est dans le PATH, sinon son chemin complet. Il doit être connecté à ton abonnement (ouvre un terminal : `claude`, puis `/login`). Aucune clé d'API n'est utilisée : ANTHROPIC_API_KEY est même retirée de l'environnement de l'appel.
commande = claude

# Modèle utilisé : sonnet (recommandé : bon rapport qualité / usage), opus (plus coûteux en usage), haiku (rejeté lors des essais : invente des détails), ou un nom complet de modèle.
modele = sonnet

# Effort de réflexion : medium (recommandé : plus fiable, ~2 min par séance), low (plus rapide, moins fiable : il a raccourci le résumé lors des essais), high, xhigh ou max (plus lent et plus d'usage de l'abonnement).
effort = medium

# Temps maximal d'attente (s) d'une réponse de Claude.
delai_s = 900

# Options supplémentaires de la ligne de commande (ignore CLAUDE.md, hooks, plugins et réglages perso de ton Claude Code). Si ta version de Claude Code ne connaît pas --safe-mode (erreur « unknown option »), vide ce réglage ou mets à jour : `claude update`.
options = --safe-mode

# ---- Voix du bot (OmniVoice ou Chatterbox) : « Dans l'épisode précédent… » dicté dans le canal vocal ----
[voix]
# Active la voix du bot (nécessite install_voix.bat). Désactivée : aucune synthèse vocale, aucune lecture.
activer = non

# oui : Whisper est retiré de la mémoire (GPU) pendant une synthèse vocale puis rechargé, pour ne jamais avoir les deux
# modèles en même temps ; la synthèse, /dire et /campagne audio sont alors refusés pendant un enregistrement.
# non : Whisper reste chargé, la transcription continue et la voix fonctionne aussi pendant un enregistrement, mais
# il faut assez de mémoire GPU pour les deux (voir la ligne de mémoire GPU dans la console).
liberer_whisper = non

# Au /record, le bot dicte dans le canal vocal le « précédemment » de la dernière séance (audio préparé à l'avance).
au_demarrage = oui

# Moteur de synthèse : omnivoice (install_omnivoice.bat) ou chatterbox (install_voix.bat). Changer de moteur invalide
# les audios déjà préparés.
moteur = omnivoice

# Python de l'environnement de la voix (vide = celui écrit par l'installeur du moteur choisi, sinon celui du bot).
python = 

# Langue lue (code à deux lettres : fr, en, es...).
langue = fr

# Dossier commun des voix du bot : un échantillon audio (~10 s) par voix, nommé voix.<nom>.wav (ou .mp3, .flac). Avec OmniVoice, voix.<nom>.txt donne la transcription de l'échantillon ; sans lui, OmniVoice la devine avec Whisper. La voix d'une campagne se choisit avec /voix, une voix ponctuelle avec le paramètre nom_voix de /dire et /campagne audio. À n'utiliser qu'avec l'accord de la personne dont c'est la voix.
dossier = voix

# Ancien réglage, toujours pris en compte : échantillon par défaut quand la campagne n'a pas de voix choisie (/voix). Une campagne peut aussi avoir un voix.wav dans son dossier (ancien système). Vide = voix par défaut du moteur.
voix_reference = 

# cuda ou cpu (vide = automatique).
device = 

# Vitesse de lecture (1.0 = normale, 1.15 = un peu plus rapide). Appliquée sans changer la hauteur de la voix. Entre 0.5 et 2.0.
vitesse = 1.0

# Silence (s) entre deux morceaux de texte (avant accélération).
pause_s = 0.25

# OmniVoice : nombre d'étapes de génération (32 = qualité recommandée, 16 = plus rapide). Sans effet avec Chatterbox.
etapes = 32

# Chatterbox uniquement. Variabilité de la synthèse (0.8 = défaut de Chatterbox). 0.6 limite les mots farfelus et les bruits ; trop bas, la voix devient monotone. Si un audio est raté, relance avec /campagne audio force.
temperature = 0.6

# Longueur visée (en mots) du « précédemment » demandé à l'IA dans les prompts. ~110 mots = environ 40 s à voix haute. Ne change pas un texte déjà écrit.
mots = 110

# Longueur maximale (caractères) d'un texte dit avec /dire (environ 40 s de voix pour 600 caractères).
dire_max = 600

# Temps maximal (s) d'une synthèse vocale.
delai_s = 900
